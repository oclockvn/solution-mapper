name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SolutionMapper.sln

      - name: Build
        run: dotnet build SolutionMapper.sln -c Release --no-restore

      - name: Test
        run: dotnet test SolutionMapper.sln -c Release --no-build
